name: Backend CI - Java & Database Validation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: autobot_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Aviso - proyecto Maven aún no existe
        if: hashFiles('pom.xml') == ''
        run: echo "No hay pom.xml todavía. Se omiten compilación y pruebas."

      - name: Configurar Java 21 (JDK)
        if: hashFiles('pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas con Maven
        if: hashFiles('pom.xml') != ''
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/autobot_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgrespassword
        run: mvn -B clean verify