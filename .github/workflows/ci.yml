name: Backend CI - Java & Database Validation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: autobot_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas con Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/autobot_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: mvn -B -ntp clean verify

  etl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: autobot_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: autobot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      REQUIRE_DB: "1"

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Instalar dependencias del ETL
        run: pip install -r etl/requirements.txt

      - name: Aplicar las migraciones al esquema de pruebas
        run: |
          for f in $(printf '%s\n' src/main/resources/db/migration/V*.sql | sort -V); do
            echo "Aplicando $f"
            psql -h localhost -U postgres -d autobot_db -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Ejecutar las pruebas del ETL
        run: pytest etl -v -rs
