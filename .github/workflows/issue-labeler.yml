name: Etiquetar issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const campo = (nombre) => {
              const m = body.match(new RegExp(`### ${nombre}\\s*\\n\\s*\\n([^\\n]+)`));
              const v = m ? m[1].trim() : '';
              return v && v !== '_No response_' ? v : null;
            };

            const labels = [];
            const epica = campo('Épica');
            const historia = campo('Historia de usuario');
            const tipo = campo('Tipo');
            const prioridad = campo('Prioridad');

            if (epica) labels.push(`epica:${epica}`);
            if (historia) labels.push(`us:${historia.replace(/^US-/, '')}`);
            if (tipo) labels.push(`tipo:${tipo}`);
            if (prioridad) labels.push(`prioridad:${prioridad}`);

            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
