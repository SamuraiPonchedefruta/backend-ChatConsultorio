spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autobot_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: c3VwZXJzZWNyZXRrZXlmb3JhdXRvYm90YmFja2VuZHdpdGhhdGxlYXN0MzJieXRlcw==
    expiration-minutes: 60
    issuer: autobot-backend
