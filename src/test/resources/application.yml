spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autobot_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

app:
  jwt:
    secret: c3VwZXJzZWNyZXRrZXlmb3JhdXRvYm90YmFja2VuZHdpdGhhdGxlYXN0MzJieXRlcw==
    expiration-minutes: 60
    issuer: autobot-backend
  login:
    max-intentos: 5
    bloqueo-minutos: 15

chatbot:
  visitante:
    limite-diario: 10

management:
  health:
    mail:
      enabled: false

# Copia de la compresión de src/main/resources/application.yml:
# este archivo reemplaza al principal cuando corren los tests.
server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 512
