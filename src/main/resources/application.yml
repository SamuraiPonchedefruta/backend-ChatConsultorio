spring:
  application:
    name: autobot-backend
  profiles:
    default: local
  # Lee el archivo .env de la raíz si existe (en CI/staging/prod no existe y no pasa nada)
  config:
    import: optional:file:.env[.properties]
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

app:
  jwt:
    # Sin valor por defecto en ningún perfil: si falta JWT_SECRET la aplicación no arranca.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: ${JWT_ISSUER:autobot-backend}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
