spring:
  application:
    name: autobot-backend
  profiles:
    default: local
  # Lee el archivo .env de la raíz si existe (en CI/staging/prod no existe y no pasa nada)
  config:
    import: optional:file:.env[.properties]
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always