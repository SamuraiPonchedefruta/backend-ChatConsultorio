spring:
  application:
    name: autobot-backend
  # Lee el archivo .env de la raíz si existe (en CI no existe y no pasa nada)
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:autobot_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
