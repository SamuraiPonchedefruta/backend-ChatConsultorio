# Perfil local: desarrollo con Docker Compose.
# Host, puerto, base y usuario tienen defaults; la contraseña SIEMPRE viene de .env.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:autobot_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
logging:
  level:
    com.autobot: DEBUG
